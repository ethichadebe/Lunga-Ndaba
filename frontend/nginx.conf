# Serves the built site and passes /api and /media to the backend.
# Upstream is resolved at request time, so this container starts even when
# the backend is not up yet (the deploy starts the candidate frontend alone).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Originals from a camera can be large; uploads go one file at a time.
  client_max_body_size 210m;
  client_body_timeout 300s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  set $backend http://backend:3003;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Web sizes of the photographs. Immutable: the file name changes when they do.
  location /media/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
